[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grey-panda"
version = "1.0.0"
description = "The calm guardian for AI, agent, and MCP code — a zero-dependency, standards-anchored AI security toolkit for developers and security reviewers."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ai-security", "llm-security", "owasp", "prompt-injection", "mcp",
    "model-context-protocol", "agentic", "aisvs", "dlp", "sast", "guardrails",
    "appsec", "sarif", "agent-security",
]
authors = [{ name = "Grey Panda contributors" }]
maintainers = [{ name = "Grey Panda contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
# Zero runtime dependencies — this is a first-class design principle, not an accident.
dependencies = []

[project.urls]
Homepage = "https://github.com/greypanda/grey-panda"
Repository = "https://github.com/greypanda/grey-panda"
Documentation = "https://github.com/greypanda/grey-panda/tree/main/docs"
Issues = "https://github.com/greypanda/grey-panda/issues"
Changelog = "https://github.com/greypanda/grey-panda/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Everything here is dev-only. The shipped package still has zero runtime deps.
dev = ["pytest>=7", "mypy>=1.8", "ruff>=0.4"]

[project.scripts]
greypanda = "greypanda.cli.main:main"
gp = "greypanda.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/greypanda"]

[tool.hatch.build.targets.wheel.force-include]
"docs/AI_SECURITY_CHECKLIST.md" = "greypanda/docs/AI_SECURITY_CHECKLIST.md"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/standards",
    "/skill",
    "/appsec",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
