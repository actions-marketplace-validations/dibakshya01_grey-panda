name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, dev extras)
        run: python -m pip install -e ".[dev]"
      - name: Run tests (zero-dependency unittest)
        run: python -m unittest discover -s tests -v
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/greypanda || true

  self-scan:
    # Dogfooding: Grey Panda scans itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Grey Panda scans Grey Panda (honors .greypandaignore)
        run: gp scan . --profile enterprise --fail-on HIGH
