name: 🐞 Bug report
description: Something in Grey Panda isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make Grey Panda better! Please do **not** paste real secrets or PII.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a minimal (sanitised) code sample if relevant.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grey Panda version
      description: Output of `gp --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version & OS
    validations:
      required: true
