# Grey Panda pre-commit hooks. Install: pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: grey-panda
        name: 🐼 Grey Panda AI security scan
        entry: gp scan --profile team --fail-on HIGH
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
